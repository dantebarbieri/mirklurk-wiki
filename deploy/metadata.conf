Alias "/robots.txt" "/usr/local/lib/mirklurk/robots.php"
AliasMatch "^/(sitemap\.xml|sitemap-[A-Za-z0-9_-]+\.xml)$" "/var/lib/mirklurk-sitemap/public/$1"

<Directory "/usr/local/lib/mirklurk">
    Require all denied
    <Files "robots.php">
        Require all granted
    </Files>
</Directory>
<Directory "/var/lib/mirklurk-sitemap/public">
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
    <FilesMatch "\.xml$">
        ForceType application/xml
        Header set Cache-Control "public, max-age=300"
        Header set X-Content-Type-Options "nosniff"
    </FilesMatch>
</Directory>
