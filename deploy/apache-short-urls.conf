<VirtualHost *:80>
    DocumentRoot /var/www/html
    AllowEncodedSlashes NoDecode
    RewriteEngine On

    # Let MediaWiki parse the original REQUEST_URI; never construct ?title=$1.
    # https://www.mediawiki.org/wiki/Manual:Short_URL/Apache
    RewriteRule ^/?w(/.*)?$ %{DOCUMENT_ROOT}/index.php [END]
    RewriteRule ^/?$ %{DOCUMENT_ROOT}/index.php [END]

    # Mounted images may not contain upstream .htaccess files.
    <Directory /var/www/html/images>
        AllowOverride None
        Options -Indexes -ExecCGI -Includes
        SetHandler none
        <IfModule php_module>
            php_admin_flag engine off
        </IfModule>
        Header always set X-Content-Type-Options nosniff
        <FilesMatch "(?i)^(?!.*\.(?:png|jpe?g|webp)$)">
            Require all denied
        </FilesMatch>
    </Directory>
    <DirectoryMatch "^/var/www/html/images/(?:deleted|temp)(?:/|$)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
