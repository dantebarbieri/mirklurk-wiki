name: Validate authored publication

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Validate indexed publication, facts, ignore rules, and deterministic XML
        run: |
          python3 tools/check_publication.py
          python3 -m unittest discover -s tests -v
      - name: Validate secret-file runtime configuration
        run: |
          php -l deploy/install.php
          php -l deploy/healthcheck.php
          php tests/test_runtime.php
  docker-smoke:
    needs: publication
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Test disposable image and database; never deploy
        run: python3 tools/smoke_deploy.py --run --evidence-dir "$RUNNER_TEMP/mirklurk-prefix-evidence"
      - name: Retain nonsecret rehearsal evidence for independent review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: disposable-prefix-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mirklurk-prefix-evidence
          retention-days: 7
          if-no-files-found: error
