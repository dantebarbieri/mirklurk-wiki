name: Validate and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      adopt:
        description: "Pages a person edited that the sync may now replace (titles separated by |)"
        required: false
        default: ""

concurrency:
  # Pull-request runs never wait for each other. Main runs queue in order and none is dropped,
  # so a publish is never cut off and a manual adopt run is never replaced by a newer push.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate indexed publication, facts, ignore rules, and deterministic XML
        run: |
          python3 tools/check_publication.py
          python3 -m unittest discover -s tests -v
      - name: Validate secret-file runtime configuration
        run: |
          php -l deploy/install.php
          php -l deploy/healthcheck.php
          php tests/test_runtime.php
          php tests/test_metadata.php
  docker-smoke:
    needs: publication
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the disposable browser test runner
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Install, publish and exercise a disposable wiki; never contacts the live wiki
        env:
          MIRKLURK_SMOKE_ARTIFACTS: ${{ runner.temp }}/mirklurk-browser
        run: python3 tools/smoke_deploy.py --run
      - name: Preserve synthetic-only Vector screenshots and measured geometry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vector-layout
          path: ${{ runner.temp }}/mirklurk-browser
          if-no-files-found: warn
          retention-days: 7
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Show what this change would publish (read-only, no login)
        env:
          MIRKLURK_API_URL: ${{ vars.MIRKLURK_API_URL }}
        run: |
          if [ -z "$MIRKLURK_API_URL" ]; then
            echo "::notice::Set the MIRKLURK_API_URL repository variable to preview live changes."
            exit 0
          fi
          python3 tools/sync_wiki.py
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [publication, docker-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Publish changed pages to the live wiki
        env:
          MIRKLURK_API_URL: ${{ vars.MIRKLURK_API_URL }}
          MIRKLURK_BOT_USERNAME: ${{ secrets.MIRKLURK_BOT_USERNAME }}
          MIRKLURK_BOT_PASSWORD: ${{ secrets.MIRKLURK_BOT_PASSWORD }}
          ADOPT: ${{ inputs.adopt }}
        run: |
          if [ -z "$MIRKLURK_API_URL" ] || [ -z "$MIRKLURK_BOT_USERNAME" ] || [ -z "$MIRKLURK_BOT_PASSWORD" ]; then
            echo "::notice::Publishing is not configured yet; see docs/PUBLISHING.md."
            exit 0
          fi
          python3 tools/sync_wiki.py --apply --adopt "$ADOPT"
