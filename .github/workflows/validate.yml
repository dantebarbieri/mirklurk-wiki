name: Validate and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      adopt:
        description: "Pages a person edited that the sync may now replace (titles separated by |)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale pull-request runs; queue main runs so a publish is never cut off midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate indexed publication, facts, ignore rules, and deterministic XML
        run: |
          python3 tools/check_publication.py
          python3 -m unittest discover -s tests -v
      - name: Validate secret-file runtime configuration
        run: |
          php -l deploy/install.php
          php -l deploy/healthcheck.php
          php tests/test_runtime.php
  docker-smoke:
    needs: publication
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install, publish and exercise a disposable wiki; never contacts the live wiki
        run: python3 tools/smoke_deploy.py --run
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Show what this change would publish (read-only, no login)
        env:
          MIRKLURK_API_URL: ${{ vars.MIRKLURK_API_URL }}
        run: |
          if [ -z "$MIRKLURK_API_URL" ]; then
            echo "::notice::Set the MIRKLURK_API_URL repository variable to preview live changes."
            exit 0
          fi
          python3 tools/sync_wiki.py
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [publication, docker-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Publish changed pages to the live wiki
        env:
          MIRKLURK_API_URL: ${{ vars.MIRKLURK_API_URL }}
          MIRKLURK_BOT_USERNAME: ${{ secrets.MIRKLURK_BOT_USERNAME }}
          MIRKLURK_BOT_PASSWORD: ${{ secrets.MIRKLURK_BOT_PASSWORD }}
          ADOPT: ${{ inputs.adopt }}
        run: |
          if [ -z "$MIRKLURK_API_URL" ] || [ -z "$MIRKLURK_BOT_USERNAME" ] || [ -z "$MIRKLURK_BOT_PASSWORD" ]; then
            echo "::notice::Publishing is not configured yet; see docs/PUBLISHING.md."
            exit 0
          fi
          python3 tools/sync_wiki.py --apply --adopt "$ADOPT"
